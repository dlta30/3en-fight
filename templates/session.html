<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/static/style.css"><body><header><div class="logo">3eN <small>FIGHT</small></div><a href="/">لوحة التحكم</a></header><main><h1>جلسة {{x.player}}</h1><div class="card"><h2>رابط رفع الملفات</h2><input id="u" value="{{up}}" readonly><button onclick="navigator.clipboard.writeText(document.getElementById('u').value)">نسخ الرابط</button><a class="button" href="/report/{{x.id}}.csv">تحميل تقرير CSV</a><p class="muted">لا يمكن للموقع الوصول إلى ملفات جهاز اللاعب تلقائيًا.</p></div><div class="card"><h2>النتائج</h2><table><tr><th>الملف</th><th>الحجم</th><th>المؤشرات</th><th>SHA-256</th></tr>{% for r in x.results %}<tr><td>{{r.file}}</td><td>{{r.size}}</td><td class="red">{{r.hits|join(', ') if r.hits else 'لا تطابق اسم'}}</td><td class="hash">{{r.sha256}}</td></tr>{% endfor %}</table></div></main></body></html>
